version: 2
# How updates arrive (docs/engineering-standards.md section 13):
# - Minor and patch updates come as ONE grouped pull request per ecosystem, so CI tests them together, the way they will run together:
#   seven separate pull requests each passed alone, but nobody had tested the set (agent log 50). The build's enforcer rules then refuse
#   any version conflict (no jar hell).
# - A major version of a runtime framework is a planned migration (its own branch and tests) and is not proposed: Spring Boot and springdoc
#   (Boot 4), the Java base image (the Java version), React. Majors of build and test tools ARE proposed: ignoring them once hid two
#   critical Vitest advisories whose only fix was a new major (agent log 50).
# - GitHub's options reference marks `ignore` as a version-update option (security updates are not listed as affected).
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch: { update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions   # majors included: they carry runtime fixes (Node 20 deprecation) and rarely break a workflow
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "amazoncorretto"   # the major is the Java version (17, as the role asks); moving to 21 is a decision, not a bump
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule: { interval: weekly }
    open-pull-requests-limit: 10           # the default of 5 held back a vite security patch behind five test-library bumps
    groups:
      npm-minor-and-patch: { update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
