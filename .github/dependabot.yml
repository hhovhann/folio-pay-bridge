version: 2
# Minor and patch updates are proposed automatically. A new major version is proposed too, except for the frameworks whose major is a
# planned migration (its own branch and tests): Spring Boot and springdoc (Boot 4), the Java base image (the Java version), React and its
# build tooling. GitHub's options reference marks `ignore` as a version-update option (security updates are not listed as affected); the
# list is kept that short anyway, so a fix that ships only in a new major of any other library still arrives as a pull request.
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions   # majors included: they carry runtime fixes (Node 20 deprecation) and rarely break a workflow
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "amazoncorretto"   # the major is the Java version (17, as the role asks); moving to 21 is a decision, not a bump
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
