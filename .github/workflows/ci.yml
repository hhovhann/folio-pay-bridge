name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: corretto, java-version: '17', cache: maven }
      - run: ./mvnw -B verify
      - run: python3 tools/check_specs.py
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: surefire-reports, path: target/surefire-reports }
  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t folio-pay-bridge:ci .
