# The test world, for every Spring test that activates the "test" profile: the simulated hotel (its code, the card's payment method, the
# bridge's interface cashier), the in-memory master key, the in-process processor and PMS, and short retries. A test sets only what it is
# about on top of this (@SpringBootTest properties win over a profile). FailClosedStartupTest sets every property itself on purpose: it
# proves which missing setting stops the start.
foliopay.opera.hotel-id=DEMO1
foliopay.opera.payment-method=CC
foliopay.opera.cashier-id=9001
foliopay.keys=local
foliopay.gateway=fake
foliopay.demo-controls=true
foliopay.retry.initial-backoff=10ms
