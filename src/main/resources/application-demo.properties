# Demo profile: in-memory master key, fake processor and PMS controls, the console's fault switches. Never for production.
foliopay.keys=local
foliopay.gateway=fake
foliopay.demo-controls=true
# The simulated hotel: its code, the card's payment method and the bridge's interface cashier.
foliopay.opera.hotel-id=DEMO1
foliopay.opera.payment-method=CC
foliopay.opera.cashier-id=9001
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
