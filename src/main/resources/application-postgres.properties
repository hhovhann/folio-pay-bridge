spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it (D-12).
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# Timestamps are written and read in UTC whatever the JVM or database session zone; the hotel's day comes from foliopay.business-zone (D-18).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Connection pool (HikariCP). Size it so tasks x pool size stays well under the database's max_connections; a request that cannot get a
# connection in 5 s fails fast (and is retried by the client with the same idempotency key) instead of queueing behind a slow database.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000
# production also needs: foliopay.keys=kms, foliopay.kms.key-id=<alias or ARN>, foliopay.gateway=http with its foliopay.http.*,
# authentication (foliopay.auth.jwt.* or foliopay.auth.api-keys), DB_URL with sslmode=verify-full, and LOGGING_CONFIG=classpath:logback-json.xml
