# Full-flow profile (Docker Compose): the bridge talks over HTTP to the OPERA and processor simulators.
# Local throwaway keys and demo controls: a demo, never production.
foliopay.keys=local
foliopay.allow-ephemeral-keys=true
foliopay.gateway=http
foliopay.demo-controls=true
# The OPERA simulator's hotel: the payment method and the interface cashier it accepts.
foliopay.opera.hotel-id=DEMO1
foliopay.opera.payment-method=CC
foliopay.opera.cashier-id=9001
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
