spring.application.name=folio-pay-bridge
spring.datasource.url=jdbc:h2:mem:folio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
# In-memory H2 schema from the entities for tests and the single-app demo; the postgres profile switches to Flyway + validate (D-12).
spring.flyway.enabled=false
# Authentication is ours (SecurityConfig): no generated default user and password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.show-sql=false
server.port=8081
server.address=127.0.0.1
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.persistent=false
# Form posts are parsed by Tomcat, not RequestSizeFilter: cap them the same way (OWASP A04).
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
# JSON only: multipart is never parsed, so a multipart body is capped by RequestSizeFilter like any other.
spring.servlet.multipart.enabled=false
# keys: "local" (demo and tests only, in-memory master key) or "kms" (needs foliopay.kms.key-id and an AWS role).
# There is no default: starting without a choice fails, so a missing setting can never fall back to a throwaway key.
foliopay.keys=${FOLIOPAY_KEYS:}
foliopay.business-zone=Asia/Dubai
# processor and PMS adapters: "fake" (demo and tests) is the only one built; with nothing set the app refuses to start rather than pretend to move money
foliopay.gateway=${FOLIOPAY_GATEWAY:}
foliopay.allowed-hosts=localhost,127.0.0.1,[::1]
foliopay.opera.hotel-id=DEMO1
foliopay.opera.folio-window=1
foliopay.opera.payment-code=CC
foliopay.opera.cashier-id=FPBRIDGE
foliopay.retry.max-attempts=3
foliopay.retry.initial-backoff=200ms
foliopay.retry.multiplier=2.0
foliopay.retry.jitter=0.5
foliopay.demo-controls=false
# Authentication (D-30): OAuth2 client credentials, preferred:
#   foliopay.auth.jwt.jwk-set-uri, foliopay.auth.jwt.issuer, foliopay.auth.jwt.audience (all three), foliopay.auth.jwt.scope-prefix (optional)
# and/or API keys: foliopay.auth.api-keys=name:sha256hex:scope scope,... (make one with tools/new_api_key.py). With a real gateway and
# neither, the application refuses to start. Scopes: cards:write payments:write bookings:write payments:read operations
# Webhooks (D-35), off unless a URL is set: foliopay.webhook.url (https), foliopay.webhook.secret (32+ characters, from Secrets Manager)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# OpenAPI description and Swagger UI are off unless a profile turns them on (the demo profile does)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
