spring.application.name=folio-pay-bridge
spring.datasource.url=jdbc:h2:mem:folio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
# In-memory H2 schema from the entities for tests and the single-app demo; the postgres profile switches to Flyway + validate (D-12).
spring.flyway.enabled=false
# Authentication is ours (SecurityConfig): no generated default user and password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.show-sql=false
server.port=8081
server.address=127.0.0.1
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.persistent=false
# Form posts are parsed by Tomcat, not RequestSizeFilter: cap them the same way (OWASP A04).
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
# JSON only: multipart is never parsed, so a multipart body is capped by RequestSizeFilter like any other.
spring.servlet.multipart.enabled=false
# keys: "local" (demo and tests only, in-memory master key) or "kms" (needs foliopay.kms.key-id and an AWS role).
# There is no default: starting without a choice fails, so a missing setting can never fall back to a throwaway key.
foliopay.keys=${FOLIOPAY_KEYS:}
foliopay.business-zone=Asia/Dubai
# processor and PMS adapters: "fake" (in-process, demo and tests) or "http" (OPERA Cloud over OHIP and the processor's REST API, foliopay.http.*);
# with nothing set the app refuses to start rather than pretend to move money
foliopay.gateway=${FOLIOPAY_GATEWAY:}
foliopay.allowed-hosts=localhost,127.0.0.1,[::1]
# The hotel's OPERA configuration: its hotel code, its payment method code for the card and the interface cashier OPERA assigned to the
# bridge (a number). No defaults: they come from the environment (FOLIOPAY_OPERA_HOTEL_ID, FOLIOPAY_OPERA_PAYMENT_METHOD,
# FOLIOPAY_OPERA_CASHIER_ID) and a start without one fails, so a payment is never posted under someone else's cashier (D-17).
foliopay.opera.folio-window=1
# The hotel's deposit policy (D-17: asks guests for money, so no default in code): for a flexible rate, this percent of the total, due this
# many days before arrival; inside that window the full amount is asked now.
foliopay.payment-request.deposit-percent=20
foliopay.payment-request.deposit-lead-days=7
# Operating settings with defaults in their properties records, listed here so an operator sees them: how long a business date read from
# OPERA is used while OPERA cannot be reached (foliopay.opera.business-date-max-staleness=24h); webhook delivery back-off and batch
# (foliopay.webhook.first-retry=30s, foliopay.webhook.longest-wait=1h, foliopay.webhook.batch-size=100, foliopay.webhook.max-attempts=12).
foliopay.retry.max-attempts=3
foliopay.retry.initial-backoff=200ms
foliopay.retry.multiplier=2.0
foliopay.retry.jitter=0.5
foliopay.demo-controls=false
# Authentication (D-30): OAuth2 client credentials, preferred:
#   foliopay.auth.jwt.jwk-set-uri, foliopay.auth.jwt.issuer, foliopay.auth.jwt.audience (all three), foliopay.auth.jwt.scope-prefix (optional)
#   (Amazon Cognito sets no audience on client-credentials tokens: leave audience empty and set scope-prefix to the resource server id)
# and/or API keys: foliopay.auth.api-keys=name:sha256hex:scope scope,... (make one with tools/new_api_key.py). With a real gateway and
# neither, the application refuses to start. Scopes: cards:write payments:write links:write bookings:write payments:read operations
# Webhooks (D-35), off unless a URL is set: foliopay.webhook.url (https), foliopay.webhook.secret (32+ characters, from Secrets Manager)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# OpenAPI description and Swagger UI are off unless a profile turns them on (the demo profile does)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
# Logging: INFO for every state change of a payment; LOGGING_LEVEL_DEV_FOLIOPAY=DEBUG adds the decisions in between (ids, keys, amounts,
# statuses; never a card number or a card token). Production logs one JSON object per line: LOGGING_CONFIG=classpath:logback-json.xml.
logging.level.dev.foliopay=INFO
# The audit trail (D-43, PCI DSS 10.2): its own logger, always at INFO; the application refuses to start if it is lowered. Route lines from
# the logger dev.foliopay.audit to storage kept for at least a year, three months of it searchable (PCI DSS 10.5.1).
logging.level.dev.foliopay.audit=INFO
# Card retention (D-44, PCI DSS 3.2.1): a card number unused for this long is destroyed. Counted from the card's last use (stored, or opened
# for an authorisation): set it longer than the longest time from booking to check-out plus the window for late charges.
foliopay.vault.retention=90d
foliopay.vault.purge-interval=1h
foliopay.vault.purge-batch=100
