<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card processor (simulator)</title>
<style>
body{font:14px/1.45 system-ui,sans-serif;margin:0;background:#f1f3f8;color:#1c2333}
header{background:#14365d;color:#fff;padding:12px 20px}header h1{margin:0;font-size:18px}header span{opacity:.8;font-size:12px}
.banner{background:#fff3cd;color:#664d03;padding:6px 20px;font-size:12px}
main{padding:16px 20px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
section{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0001}
h2{margin:0 0 8px;font-size:14px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #e5e8f0;font-size:13px}
button,select{font:inherit;padding:6px 10px;border:1px solid #c5cbe0;border-radius:6px;background:#fff;cursor:pointer}
.big{font-size:22px;font-weight:600}.mut{color:#667}.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.wide{grid-column:span 2}
</style></head><body>
<header><h1>Card processor <span>simulator: authorise, capture, void, settlement</span></h1></header>
<div class="banner">Synthetic. It deduplicates on the Idempotency-Key header, and it keeps only the last four digits of a card.</div>
<main>
<section><h2>Captured today</h2><div class="big" data-testid="captured">0.00</div><p class="mut">What the acquirer would settle.</p></section>
<section><h2>Make it fail</h2>
  <div class="row"><select id="fault" data-testid="psp-fault"><option>NONE</option><option>DECLINE_NEXT</option><option>DECLINE_CAPTURE_NEXT</option><option>TIMEOUT_AFTER_CAPTURE</option></select>
  <button data-action="fault" data-testid="apply-fault">Apply</button><button data-action="reset">Reset</button></div>
  <p class="mut">Current fault: <b data-testid="current-fault">NONE</b></p></section>
<section class="wide"><h2>Ledger</h2>
  <table data-testid="ledger"><thead><tr><th>Reference</th><th>Kind</th><th>Card</th><th>Amount</th><th>State</th></tr></thead><tbody></tbody></table></section>
</main><script src="/sim/sim.js"></script></body></html>
