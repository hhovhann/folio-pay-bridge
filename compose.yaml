# Full-flow demo: the payment bridge against an OPERA simulator, a card-processor simulator and PostgreSQL, all over real HTTP.
# Open: bridge console http://127.0.0.1:8081 | OPERA front desk http://127.0.0.1:8090 | processor http://127.0.0.1:8091
# Everything is synthetic and published on the host's loopback only. This is not a production setup.
x-simulator: &simulator
  build: .
  entrypoint: ["java", "-cp", "app.jar", "-Dloader.main=dev.foliopaysim.SimulatorApplication", "org.springframework.boot.loader.launch.PropertiesLauncher"]
  environment: &simulator-env
    SERVER_ADDRESS: 0.0.0.0

services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: folio, POSTGRES_USER: folio, POSTGRES_PASSWORD: folio }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U folio"], interval: 3s, retries: 20 }

  opera-sim:
    <<: *simulator
    ports: ["127.0.0.1:8090:8090"]
    environment:
      <<: *simulator-env
      SPRING_PROFILES_ACTIVE: opera
      SERVER_PORT: "8090"
      SIM_OPERA_BRIDGE_URL: http://app:8081

  psp-sim:
    <<: *simulator
    ports: ["127.0.0.1:8091:8091"]
    environment:
      <<: *simulator-env
      SPRING_PROFILES_ACTIVE: psp
      SERVER_PORT: "8091"

  app:
    build: .
    depends_on: { db: { condition: service_healthy }, opera-sim: { condition: service_started }, psp-sim: { condition: service_started } }
    ports: ["127.0.0.1:8081:8081"]
    stop_grace_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: postgres,compose
      DB_URL: jdbc:postgresql://db:5432/folio
      DB_USER: folio
      DB_PASSWORD: folio
      FOLIOPAY_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],app
      FOLIOPAY_HTTP_OPERA_BASE_URL: http://opera-sim:8090
      FOLIOPAY_HTTP_OPERA_APP_KEY: demo-app-key
      FOLIOPAY_HTTP_OPERA_CLIENT_ID: fpbridge
      FOLIOPAY_HTTP_OPERA_CLIENT_SECRET: fpbridge-secret
      FOLIOPAY_HTTP_PSP_BASE_URL: http://psp-sim:8091
      FOLIOPAY_HTTP_PSP_API_KEY: demo-psp-key
